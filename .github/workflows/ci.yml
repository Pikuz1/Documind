name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency: # a new push cancels the still-running checks of the previous one
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_PROVIDER: fake # no LLM calls or model downloads in CI
  # Linux and Windows PyPI wheels of PyTorch bundle CUDA (~2.5 GB); CI only needs CPU.
  TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Docker covers end users; this catches OS differences in the code itself
        # (paths, file encodings, Windows file locking).
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.*
      - name: Install CPU-only PyTorch
        if: runner.os != 'macOS' # macOS wheels are CPU-only already
        run: pip install -c requirements.lock torch --index-url "$TORCH_CPU_INDEX"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Lint
        if: runner.os == 'Linux'
        run: ruff check . && ruff format --check .
      - name: Test (100% coverage gate)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Typecheck and build
        run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.*
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -c requirements.lock torch --index-url "$TORCH_CPU_INDEX"
          pip install -r requirements.txt -c requirements.lock
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t documind .
      - name: Start the container and check it serves the API and the UI
        run: |
          docker run -d --name documind -p 8000:8000 -e AI_PROVIDER=fake documind
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' documind)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' documind | grep -qx healthy
          curl -fsS localhost:8000/api/health
          curl -fsS localhost:8000/ | grep -q '<title>DocuMind</title>'
      - name: Container logs
        if: always()
        run: docker logs documind
