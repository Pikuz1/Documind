name: Deploy demo

# Publishes the app to a Hugging Face Docker Space after CI passes on main.
# Needs two repository secrets: HF_TOKEN (Hugging Face write token) and GOOGLE_API_KEY.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Only what the Dockerfile needs; the Space gets its own README with the Space config.
      - name: Stage the Space files
        run: |
          mkdir space
          git archive HEAD Dockerfile .dockerignore frontend backend/app \
            backend/requirements.txt backend/requirements.lock backend/eval/arbeitsvertrag.pdf \
            | tar -x -C space
          cat > space/README.md <<'README'
          ---
          title: DocuMind
          emoji: 📄
          colorFrom: indigo
          colorTo: purple
          sdk: docker
          app_port: 8000
          short_description: Ask German or English contracts, answers cite the page
          ---

          Public demo of [DocuMind](https://github.com/Pikuz1/Documind), deployed by GitHub Actions.
          README

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::Add the HF_TOKEN and GOOGLE_API_KEY repository secrets first."
            exit 1
          fi
          pip install --quiet huggingface_hub
          python - <<'PY'
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = f"{api.whoami()['name']}/documind"
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.add_space_secret(space, "GOOGLE_API_KEY", os.environ["GOOGLE_API_KEY"])
          api.add_space_variable(space, "DEMO_DOCUMENT", "/app/demo/arbeitsvertrag.pdf")
          # delete_patterns removes files that are no longer part of the app.
          api.upload_folder(
              repo_id=space,
              repo_type="space",
              folder_path="space",
              delete_patterns="*",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
          )
          user, name = space.split("/")
          print(f"Demo: https://{user.lower()}-{name}.hf.space")
          PY
