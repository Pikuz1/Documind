[project]
name = "documind"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-fail-under=100"
filterwarnings = [
    # PyPDFLoader still lives in langchain-community, which now warns on import.
    "ignore:.*langchain-community.*is being sunset:DeprecationWarning",
    # Fake embeddings are random vectors, so cosine relevance can dip below 0; the threshold handles it.
    "ignore:Relevance scores must be between 0 and 1:UserWarning",
]

[tool.coverage.run]
omit = ["scripts/*"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
